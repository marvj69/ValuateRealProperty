<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5e9">
    <title>Offline | MarketIntel</title>
    <style>
        :root {
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 55%), #f8fafc;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: #0f172a;
            padding: 24px;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 12px;
        }
        p {
            margin: 0 0 18px;
            line-height: 1.5;
            color: #475569;
        }
        button {
            background: #0ea5e9;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.25);
        }
        button:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>We can't reach the MarketIntel service right now. Check your connection, then try again.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
